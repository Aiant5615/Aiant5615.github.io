# ── Site ─────────────────────────────────────────────────────
title: Seungwon's Research Log
tagline: Paper reviews with the equations and figures explained
description: "Paper reviews on how language models are trained, aligned, and extended to vision and robotics, with the equations and figures explained."
author: Seungwon Kook
url: "https://aiant5615.github.io"
baseurl: ""
lang: en
timezone: Asia/Seoul

# This site's repo
github_repo: Aiant5615/Aiant5615.github.io
github_branch: main

# Private tracker data: the tracker page reads/writes this file through the GitHub API with a browser-stored token
tracker_repo: Aiant5615/tracker
tracker_branch: main
tracker_file: days.json

# LeetCode solutions repo (synced hourly by .github/workflows/sync-leetcode.yml)
leetcode_repo: Aiant5615/leetcode
leetcode_branch: main

# ── Tracker ──────────────────────────────────────────────────
# habits: things to check off daily. `key` is what goes in `done:` in _data/days/*.yml.
tracker:
  arrive_goal: "09:00"      # target arrival time
  skip_weekends: true       # if true, Sat/Sun neither break nor count toward streaks (override per habit with weekends: true)
  leetcode_habit: coding    # this habit is auto-checked on days with a new LeetCode solution (derived from _data/leetcode.json)
  habits:
    - key: english
      label: English
      emoji: "🇬🇧"
    - key: coding
      label: Coding
      emoji: "💻"
    - key: paper
      label: Paper reading
      emoji: "📄"
      weekly_goal: 5          # shown as "n / 5 this week" instead of a streak
    - key: exercise
      label: Exercise
      emoji: "🏃"
      weekly_goal: 3
      weekends: true        # count weekends for this habit

# ── Jekyll ───────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /blog/:title/
paginate_path: none

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      image: /assets/og.png
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/og.png

exclude:
  - scripts
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .venv
  - node_modules
