# ── Site ─────────────────────────────────────────────────────
title: Seungwon's Research Log
description: Grad school life, tracked — paper reviews, study habits, and lab arrival times
author: Seungwon Kook
url: "https://aiant5615.github.io"
baseurl: ""
lang: en
timezone: Asia/Seoul

# GitHub repo (used by the tracker's "Save to GitHub" button to open the Issue form)
github_repo: Aiant5615/Aiant5615.github.io
github_branch: main
log_issue_template: log.yml

# ── Tracker ──────────────────────────────────────────────────
# habits: things to check off daily. `key` is what goes in `done:` in _data/days/*.yml.
tracker:
  arrive_goal: "09:00"      # target arrival time
  skip_weekends: true       # if true, Sat/Sun neither break nor count toward streaks (override per habit with weekends: true)
  habits:
    - key: english
      label: English
      emoji: "🇬🇧"
    - key: coding
      label: Coding
      emoji: "💻"
    - key: paper
      label: Paper reading
      emoji: "📄"
    - key: exercise
      label: Exercise
      emoji: "🏃"
      weekends: true        # count weekends for this habit

# ── Jekyll ───────────────────────────────────────────────────
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
paginate_path: none

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - scripts
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .venv
  - node_modules
