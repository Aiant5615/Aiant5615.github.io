name: Log from issue (Issue → _data/days)

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  # log issues opened by anyone other than the owner: save nothing, close immediately
  reject:
    if: >-
      github.event.action == 'opened' &&
      github.event.issue.user.login != github.repository_owner &&
      (contains(github.event.issue.labels.*.name, 'log') || startsWith(github.event.issue.title, 'log'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - run: |
          gh issue comment "$N" --repo "$R" --body "This form is for the repository owner only. Nothing was saved."
          gh issue close "$N" --repo "$R" --reason "not planned"
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
          R: ${{ github.repository }}

  log:
    # only 'log' issues created by the repository owner (public repo: ignore everyone else)
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (contains(github.event.issue.labels.*.name, 'log') || startsWith(github.event.issue.title, 'log'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Convert issue body to a YAML entry
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python3 scripts/issue_to_log.py

      - name: Commit and push
        if: steps.parse.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/days
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "log: ${{ steps.parse.outputs.date }} (#${ISSUE_NUMBER})"
            git push
          fi


      - name: Comment on the issue and close it
        if: always() && steps.parse.outcome != 'skipped'
        env:
          OK: ${{ steps.parse.outputs.ok }}
          DATE: ${{ steps.parse.outputs.date }}
          ERR: ${{ steps.parse.outputs.error }}
        run: |
          if [ "$OK" = "true" ]; then
            body=$(printf '✅ Saved `_data/days/%s.yml`. It will appear at https://aiant5615.github.io/tracker/ in a minute or two.\n\n```yaml\n%s\n```' "$DATE" "$(cat "_data/days/$DATE.yml")")
            gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "$body"
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" --reason completed
          else
            gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "❌ Not saved: $ERR — edit the issue to retry."
          fi
