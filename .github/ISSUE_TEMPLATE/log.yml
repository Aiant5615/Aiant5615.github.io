name: 📝 Log today
description: Add a day to the routine tracker. Submitting saves it to _data/days/ automatically.
title: "log"
labels: [log]
body:
  - type: markdown
    attributes:
      value: "Fill in only what you want to add. Fields are merged into that day's existing entry (habits are added, times replaced, notes appended). An empty date means today (KST)."
  - type: input
    id: date
    attributes:
      label: Date
      description: YYYY-MM-DD (blank = today)
      placeholder: "2026-09-07"
  - type: input
    id: arrive
    attributes:
      label: Arrived at
      placeholder: "09:10"
  - type: input
    id: leave
    attributes:
      label: Left at
      placeholder: "18:30"
  - type: input
    id: done
    attributes:
      label: Done today
      description: "Comma- or space-separated: english, coding, paper, exercise"
      placeholder: "english, coding"
  - type: textarea
    id: note
    attributes:
      label: Note
  - type: input
    id: wake
    attributes:
      label: Woke up at
      placeholder: "07:30"
  - type: input
    id: sleep
    attributes:
      label: Sleep hours
      placeholder: "7"
  - type: input
    id: mood
    attributes:
      label: Mood (1-5)
      placeholder: "4"
  - type: input
    id: focus
    attributes:
      label: Focus hours
      placeholder: "3"
  - type: checkboxes
    id: replace
    attributes:
      label: Replace
      options:
        - label: Replace the whole entry for this day instead of merging (use this to un-check a habit)
