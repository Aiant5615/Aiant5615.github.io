---
layout: default
title: LeetCode
permalink: /leetcode/
sitemap: false
noindex: true
---
<div class="page-head">
  <h1>LeetCode</h1>
</div>
<div id="lc-connect" style="margin:.6rem 0 .9rem"></div>

<div id="lc-body">
<div class="card" id="lc-game-card" hidden><div id="lc-game"></div></div>

<div class="card log-hint" id="lc-onboarding" hidden>
  No problems yet.
</div>

<div id="lc-sections">
  <div id="lc-private" hidden>
    <p class="small" id="lc-private-msg"></p>
    <h2>Daily streak</h2>
    <div class="card" id="lc-heatmap"></div>

    <h2>Practice count</h2>
    <div id="lc-practice"></div>
  </div>


  <div class="section-head"><h2>Problems</h2><div id="lc-filter"></div></div>
  <div class="card" id="lc-table"></div>
</div>
</div>

<link rel="stylesheet" id="hljs-light" href="{{ '/assets/lib/hljs/github.min.css' | relative_url }}">
<link rel="stylesheet" id="hljs-dark" href="{{ '/assets/lib/hljs/github-dark.min.css' | relative_url }}" media="(prefers-color-scheme: dark)">
<script src="{{ '/assets/lib/hljs/highlight.min.js' | relative_url }}"></script>
<script>
  window.LC_PUBLIC = {{ site.data.leetcode_problems | jsonify }};
  window.LC_ALGO = {{ site.data.leetcode_algorithms | jsonify }};
  window.LEETCODE_CONFIG = { repo: {{ site.leetcode_repo | jsonify }}, branch: {{ site.leetcode_branch | default: "main" | jsonify }},
    trackerRepo: {{ site.tracker_repo | jsonify }}, trackerBranch: {{ site.tracker_branch | default: "main" | jsonify }} };
</script>
<script src="{{ '/assets/js/vault.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script src="{{ '/assets/js/heat.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script src="{{ '/assets/js/lc-game.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
<script src="{{ '/assets/js/leetcode.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
