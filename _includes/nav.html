<header class="site-header">
  <div class="container nav-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ '/tracker/' | relative_url }}" {% if page.url contains '/tracker/' %}class="active"{% endif %}>Tracker</a>
      <a href="{{ '/leetcode/' | relative_url }}" {% if page.url contains '/leetcode/' %}class="active"{% endif %}>LeetCode</a>
      <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' %}class="active"{% endif %}>Blog</a>
      <a href="{{ '/papers/' | relative_url }}" {% if page.url contains '/papers/' %}class="active"{% endif %}>Papers</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about/' %}class="active"{% endif %}>About</a>
      <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
    </nav>
  </div>
</header>
<script>
(function(){var b=document.getElementById("theme-toggle");if(!b)return;
b.addEventListener("click",function(){var r=document.documentElement,cur=r.getAttribute("data-theme");
var sys=window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";var now=(cur||sys)==="dark"?"light":"dark";
r.setAttribute("data-theme",now);try{localStorage.setItem("theme",now);}catch(e){}});})();
</script>
